name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # SDK уже есть на раннере ubuntu-latest; setup-android@v3 падает на пакете 'tools'.
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Собрать и проверить
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon ktlintCheck testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Тесты
        if: always()
        run: |
          grep -h "testsuite name" app/build/test-results/testDebugUnitTest/*.xml || true

      - name: Отчёты при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/test-results/**

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-reading-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
